components:
  schemas:
    BaseEntity:
      type: object
      required:
        - id
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    Card:
      type: object
      required:
        - title
        - unit
        - card
      properties:
        title:
          type: string
        unit:
          type: integer
          format: int32
        card:
          $ref: '#/components/schemas/CardType'
        pick:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        dangerous:
          type: array
          prefixItems:
            - type: integer
              format: int32
            - type: integer
              format: int32
            - type: integer
              format: int32
        score:
          type: integer
          format: int32
        action:
          anyOf:
            - $ref: '#/components/schemas/CardAction'
            - type: 'null'
        token:
          type: number
          enum:
            - 1
            - 2
        mode:
          $ref: '#/components/schemas/CardMode'
      allOf:
        - $ref: '#/components/schemas/BaseEntity'
    CardAction:
      type: string
      enum:
        - HEALTH_ONE
        - HEALTH_TWO
        - PICK_ONE
        - PICK_TWO
        - DESTROY
        - MULTIPLY
        - COPY
        - REDUCE
        - SORT
        - EXCHANGE_ONE
        - EXCHANGE_TWO
        - SWAP
    CardMode:
      type: string
      enum:
        - NORMAL
        - HARD
    CardType:
      type: string
      enum:
        - KNOWLEDGE
        - SKILL
        - DANGEROUS
        - AGE
    CreateCardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        unit:
          type: integer
          format: int32
        card:
          $ref: '#/components/schemas/CardType'
        pick:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        dangerous:
          type: array
          prefixItems:
            - type: integer
              format: int32
            - type: integer
              format: int32
            - type: integer
              format: int32
        score:
          type: integer
          format: int32
        action:
          anyOf:
            - $ref: '#/components/schemas/CardAction'
            - type: 'null'
        token:
          type: number
          enum:
            - 1
            - 2
        mode:
          $ref: '#/components/schemas/CardMode'
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        isActive:
          type: boolean
        isAdmin:
          type: boolean
        lastLogin:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    EmptyData:
      type: object
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type: string
    UpdateCardRequest:
      type: object
      properties:
        title:
          type: string
        unit:
          type: integer
          format: int32
        card:
          $ref: '#/components/schemas/CardType'
        pick:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
        dangerous:
          type: array
          prefixItems:
            - type: integer
              format: int32
            - type: integer
              format: int32
            - type: integer
              format: int32
        score:
          type: integer
          format: int32
        action:
          anyOf:
            - $ref: '#/components/schemas/CardAction'
            - type: 'null'
        token:
          type: number
          enum:
            - 1
            - 2
        mode:
          $ref: '#/components/schemas/CardMode'
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          anyOf:
            - type: string
            - type: 'null'
        isActive:
          type: boolean
        isAdmin:
          type: boolean
        lastLogin:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
    User:
      type: object
      required:
        - name
        - email
        - isActive
        - isAdmin
      properties:
        name:
          type: string
        email:
          type: string
        password:
